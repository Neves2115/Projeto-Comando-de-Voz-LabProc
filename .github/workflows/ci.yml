name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar o projeto
        # Só as dependências de desenvolvimento: a suíte roda inteira em modo
        # simulado, sem GPIO, sem microfone e sem modelo Vosk.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rodar os testes
        run: pytest -v

      - name: Verificar erros reais (linter)
        run: |
          pip install ruff
          ruff check centralvoz --select=E9,F,B

      - name: Verificar que cada modulo importa isolado
        run: |
          python -c "import centralvoz.commands"
          python -c "import centralvoz.app"
          python -c "import centralvoz.hardware"
          python -c "import centralvoz.ui"

      - name: Verificar que os exemplos rodam
        run: |
          for exemplo in examples/*.py; do
            echo "--- $exemplo"
            timeout 60 python "$exemplo" > /dev/null
          done

      - name: Verificar a CLI em modo simulado
        run: |
          python -m centralvoz --mock say ligar led
          python -m centralvoz doctor || true
